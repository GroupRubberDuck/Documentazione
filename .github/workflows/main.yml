name: Compilazione dei documenti e aggiornamento del sito web

on:
  push:
    branches:
      - main 
      - develop
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Typst
        uses: typst-community/setup-typst@v4

      - name: Verify Typst installation
        run: typst --version

      - name: Run Typst build script
        run: |
          chmod +x scripts/updateTypstFiles.sh
          ./scripts/updateTypstFiles.sh
          ./scripts/genWebsite.sh

      - name: Commit and push PDFs
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          mkdir -p output
          
          git add -f output/**  # -f per forzare nonostante .gitignore
          git add index.html
          #git diff --staged --quiet  || git commit -m "Auto-generate PDFs from Typst & update website [skip ci]"
          git commit -m "Auto-generate PDFs from Typst & update website [skip ci]"
          git push

      - name: Upload Artifacts
        if: always()  # <--- Questo assicura che scarichi il log anche se c'è stato un errore!
        uses: actions/upload-artifact@v4
        with:
          name: PDF-and-Logs
          path: output/