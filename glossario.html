<script>
const terms = [
  { term: "AC", def: "Actual Cost", abbr: true },
  { term: "Actual Cost", def: "Costo reale sostenuto per completare il lavoro svolto fino a un determinato momento, indipendentemente da quanto era stato pianificato o dal valore prodotto." },
  { term: "AdR", def: "Analisi dei Requisiti", abbr: true },
  { term: "Anagrafica", def: "Insieme dei dati identificativi di base associati a un'entità del sistema, come nome, codice e descrizione. Utilizzata per dispositivi, asset, requisiti e modelli." },
  { term: "Analisi dei Requisiti", def: "Processo strutturato di raccolta, analisi, classificazione e documentazione dei requisiti. Include interviste, casi d'uso e modellazione, con l'obiettivo di definire con precisione cosa il sistema deve fare prima di iniziare lo sviluppo." },
  { term: "Applicazione desktop", def: "Software installato ed eseguito localmente sul sistema operativo di un computer, senza richiedere un browser o una connessione a server remoti per il suo funzionamento principale." },
  { term: "Asset", def: "Risorsa o componente di un dispositivo soggetta a valutazione normativa. Ogni asset appartiene a una classe di asset definita dal modello normativo e contiene un insieme di requisiti da verificare." },
  { term: "Attore", def: "Entità esterna (persona fisica, ruolo organizzativo o sistema esterno) che interagisce con il software in almeno un caso d'uso. Non fa parte del sistema, ma vi si interfaccia per raggiungere un obiettivo." },
  { term: "AU", def: "Assessment Unit", abbr: true },
  { term: "Automated EN18031 Compliance Verification", def: "Nome del capitolato di progetto. Indica il sistema software sviluppato dal team GroupRubberDuck per automatizzare il processo di valutazione della conformità allo standard EN 18031." },
  { term: "BAC", def: "Budget at Completion", abbr: true },
  { term: "Backlog", def: "Lista ordinata di tutte le attività pianificate e non ancora avviate. Viene aggiornato continuamente durante il progetto e costituisce la fonte da cui si attingono i task per ogni sprint." },
  { term: "BearType", def: "Libreria Python che esegue il controllo dei tipi a runtime, verificando che i valori passati alle funzioni rispettino le annotazioni dichiarate durante l'effettiva esecuzione del programma." },
  { term: "Bivio decisionale", def: "Relazione strutturale che collega un nodo di decisione del decision tree ai suoi nodi figli, definendo i possibili percorsi di valutazione a partire da una risposta data." },
  { term: "Bluetooth", def: "Tecnologia di comunicazione wireless a corto raggio utilizzata per lo scambio di dati tra dispositivi. Nel contesto normativo EN 18031 può rappresentare un'interfaccia soggetta a valutazione." },
  { term: "Bozza operativa", def: "Rappresentazione temporanea in memoria delle modifiche apportate durante una sessione attiva, sia di valutazione che di modifica del modello. Le modifiche nella bozza diventano permanenti solo dopo un salvataggio esplicito sul sistema di permanenza." },
  { term: "Branch", def: "Ramificazione indipendente del repository Git usata per isolare lo sviluppo. Nel progetto si usano branch distinti per produzione (Main), sviluppo integrato (Develop) e singole funzionalità (Feature)." },
  { term: "BT", def: "Bluetooth", abbr: true },
  { term: "Caso d'uso", def: "Descrizione formale di un'interazione tra uno o più attori e il sistema, finalizzata al raggiungimento di un obiettivo specifico. Include precondizioni, scenario principale, scenari alternativi e postcondizioni." },
  { term: "Ciclo di vita del progetto", def: "L'insieme ordinato delle fasi che scandiscono l'intero sviluppo di un prodotto software: dall'analisi iniziale alla progettazione, implementazione, test, rilascio e manutenzione." },
  { term: "Ciclo PDCA", def: "Modello iterativo di miglioramento continuo articolato in quattro fasi: Plan (pianifica gli obiettivi), Do (esegui le attività), Check (verifica i risultati ottenuti), Act (applica le correzioni e riparte dal piano)." },
  { term: "Classe di asset", def: "Categoria che raggruppa asset con caratteristiche comuni all'interno di un modello normativo. Definisce gli attributi condivisi dagli asset che vi appartengono." },
  { term: "Code Smells", def: "Caratteristiche del codice sorgente che, pur non causando errori diretti, indicano possibili problemi strutturali o di manutenibilità e suggeriscono la necessità di un refactoring." },
  { term: "Coefficient of Coupling", def: "Misura del grado di interdipendenza tra moduli software. Un accoppiamento elevato rende il sistema più rigido e difficile da modificare, testare o riutilizzare in modo indipendente." },
  { term: "Conformità normativa", def: "Aderenza di un dispositivo ai requisiti definiti da uno standard normativo. Un dispositivo è conforme quando supera con esito positivo la valutazione di tutti i requisiti obbligatori previsti dal modello normativo di riferimento." },
  { term: "Cost Performance Index", def: "Indice di efficienza economica calcolato come rapporto EV/AC. Un valore maggiore di 1 indica che si sta producendo più valore di quanto si stia spendendo." },
  { term: "CPI", def: "Cost Performance Index", abbr: true },
  { term: "CSV", def: "Comma-Separated Values", abbr: true },
  { term: "Cybersecurity", def: "Insieme di pratiche, tecnologie e processi volti a proteggere sistemi, reti e dati da accessi non autorizzati, attacchi informatici e danni. Lo standard EN 18031 definisce requisiti di cybersecurity specifici per i dispositivi radio." },
  { term: "Cyclomatic Complexity", def: "Metrica che misura la complessità logica di un modulo software contando il numero di percorsi indipendenti nel flusso di controllo. Valori elevati indicano codice difficile da testare e manutenere." },
  { term: "Dashboard", def: "Interfaccia riepilogativa del sistema che mostra in modo aggregato lo stato di avanzamento della valutazione di un dispositivo, la lista degli asset associati e le informazioni generali del dispositivo in esame." },
  { term: "Decision Tree", def: "Struttura ad albero utilizzata per guidare la valutazione di un requisito normativo attraverso una sequenza di domande e risposte, fino a determinare un esito (pass, fail o not applicable)." },
  { term: "Definition of Done", def: "Insieme di criteri verificabili e condivisi dal team che determinano quando un'attività può essere considerata formalmente completata, evitando ambiguità sul concetto di finito." },
  { term: "Dipendenza", def: "Relazione tra requisiti che vincola l'ordine o la condizione di valutazione, indicando che un requisito dipende dall'esito o dalla presenza di un altro requisito." },
  { term: "Dipendenza circolare", def: "Condizione di errore che si verifica quando l'aggiunta di una dipendenza tra requisiti crea un ciclo chiuso (es. A dipende da B e B dipende da A). Il sistema rileva e blocca automaticamente questa condizione, mostrando il grafo delle dipendenze per evidenziare il percorso che genera il ciclo." },
  { term: "Dispositivo", def: "Oggetto fisico o sistema software sottoposto a valutazione normativa. Nel sistema è identificato da un insieme di attributi descrittivi quali nome, sistema operativo e descrizione." },
  { term: "Dispositivo radio", def: "Dispositivo elettronico che utilizza lo spettro radio per la comunicazione, soggetto alla Direttiva RED (2014/53/UE) e ai requisiti di sicurezza informatica definiti dallo standard EN 18031." },
  { term: "DN", def: "Decision Node", abbr: true },
  { term: "Docker", def: "Piattaforma di containerizzazione che consente di creare ambienti di esecuzione isolati e riproducibili, garantendo che il software si comporti in modo identico su qualsiasi macchina o sistema operativo." },
  { term: "DoD", def: "Definition of Done", abbr: true },
  { term: "DT", def: "Decision Tree", abbr: true },
  { term: "EAC", def: "Estimate at Completion", abbr: true },
  { term: "Earned Value", def: "Valore economico del lavoro effettivamente completato in un dato momento, espresso in termini di budget pianificato. Usato per misurare l'avanzamento reale del progetto." },
  { term: "Editor grafico", def: "Componente dell'applicazione che consente la visualizzazione e la modifica interattiva della struttura dei decision tree tramite un'interfaccia grafica, senza richiedere la modifica diretta dei file sottostanti." },
  { term: "EN 18031", def: "Standard tecnico europeo in tre parti che definisce i requisiti di sicurezza informatica per i dispositivi radio, associati agli articoli 3.3(d), 3.3(e) e 3.3(f) della Direttiva RED. Obbligatorio come norma armonizzata dal 1° agosto 2025." },
  { term: "End-user", def: "L'utilizzatore finale del prodotto software, ovvero la persona che interagisce direttamente con il sistema nel contesto reale d'uso, distinta dal committente o dallo sviluppatore." },
  { term: "Esportazione", def: "Operazione che consente di salvare i dati presenti nel sistema in un file esterno in uno dei formati supportati (JSON, XML, CSV, PDF), per condivisione o archiviazione." },
  { term: "Estensione", def: "Relazione UML tra casi d'uso, indicata con «extend», che descrive un comportamento opzionale che può aggiungersi al caso d'uso base al verificarsi di una condizione particolare." },
  { term: "Estimate at Completion", def: "Stima aggiornata del costo totale del progetto al suo completamento, ricalcolata tenendo conto delle performance attuali e dei costi già sostenuti." },
  { term: "Estimate to Complete", def: "Stima dei costi ancora necessari per completare il lavoro rimanente del progetto, calcolata a partire dallo stato attuale di avanzamento." },
  { term: "ETC", def: "Estimate to Complete", abbr: true },
  { term: "EV", def: "Earned Value", abbr: true },
  { term: "Evidenza", def: "Dato, documento o giustificazione fornita dall'utente a supporto della risposta assegnata a un nodo del Decision Tree durante la sessione di valutazione." },
  { term: "Fail", def: "Esito negativo della valutazione di un requisito o di un nodo del Decision Tree, che indica che il dispositivo non soddisfa il criterio verificato." },
  { term: "Firmware", def: "Software a basso livello integrato direttamente nell'hardware di un dispositivo, che ne controlla il funzionamento di base e le interazioni con i componenti fisici." },
  { term: "GitHub Actions", def: "Sistema di integrazione e distribuzione continua (CI/CD) integrato in GitHub, utilizzato per automatizzare build, esecuzione di test e pubblicazione dei documenti ad ogni modifica del repository." },
  { term: "Importazione", def: "Operazione che consente di caricare nel sistema dati strutturati provenienti da file esterni, come liste di asset in formato JSON, XML o CSV." },
  { term: "In corso", def: "Stato di valutazione di un requisito che indica che la compilazione del relativo decision tree è stata avviata ma non ancora completata." },
  { term: "Inclusione", def: "Relazione UML tra casi d'uso, indicata con «include», che descrive una funzionalità obbligatoriamente eseguita come parte del caso d'uso che la include." },
  { term: "Indice di Gulpease", def: "Metrica italiana di leggibilità del testo che valuta la comprensibilità di un documento in base alla lunghezza media delle parole e delle frasi. Valori più alti indicano testi più leggibili." },
  { term: "Instability Index", def: "Indice compreso tra 0 e 1 che misura la stabilità di un modulo software in base al rapporto tra dipendenze in uscita e totale delle dipendenze. Valori vicini a 1 indicano alta instabilità." },
  { term: "Interfaccia", def: "Punto di interazione tra il dispositivo e l'ambiente esterno, come una connessione di rete, un protocollo di comunicazione o un'API. Nel contesto normativo, le interfacce del dispositivo sono soggette a valutazione secondo EN 18031." },
  { term: "IoT", def: "Internet of Things", abbr: true },
  { term: "Issue", def: "Unità atomica di lavoro tracciata nel sistema di versionamento. Può rappresentare un'attività, un bug, una feature o una modifica documentale, con stato, assegnatario e priorità associati." },
  { term: "Issue Tracking System", def: "Strumento digitale (come GitHub Issues) usato per pianificare, assegnare, monitorare e storicizzare le attività del progetto, mantenendo traccia dello stato di avanzamento di ciascuna issue." },
  { term: "JSON", def: "JavaScript Object Notation", abbr: true },
  { term: "Layered Architecture", def: "Architettura software che organizza il sistema in livelli funzionali distinti e sovrapposti (es. presentazione, logica applicativa, accesso ai dati), dove ogni livello interagisce solo con quello adiacente." },
  { term: "LTE", def: "Long-Term Evolution", abbr: true },
  { term: "Manutenzione", def: "Fase del ciclo di vita del software che comprende le attività di correzione, adattamento e miglioramento del sistema dopo il suo rilascio, per garantirne il corretto funzionamento nel tempo." },
  { term: "Merge", def: "Operazione che unisce il codice di un branch secondario approvato nel branch di destinazione, rendendo effettive le modifiche nel progetto principale." },
  { term: "Milestone", def: "Punto di controllo significativo nella pianificazione del progetto, che segna il completamento di una fase o il raggiungimento di un obiettivo intermedio rilevante, come RTB o Product Baseline." },
  { term: "Modello di standard di default", def: "Indica il modello che l'applicazione deve associare a un dispositivo al momento della sua creazione nel sistema." },
  { term: "Modello normativo", def: "Struttura configurabile che definisce le classi di asset, i requisiti normativi e i relativi Decision Tree per uno specifico standard. Costituisce il riferimento su cui si basa la valutazione di un dispositivo." },
  { term: "MPC", def: "Metrica di Qualità del Processo", abbr: true },
  { term: "MPD", def: "Metrica di Qualità del Prodotto", abbr: true },
  { term: "MU", def: "Manuale Utente", abbr: true },
  { term: "MVC", def: "Modello architetturale che separa un'applicazione in tre componenti: Model (dati e logica di business), View (interfaccia utente) e Controller (gestione delle interazioni tra i due)." },
  { term: "MyPy", def: "Strumento di analisi statica per Python che verifica la correttezza dei tipi dichiarati nel codice senza eseguirlo, rilevando potenziali errori in fase di sviluppo." },
  { term: "NdP", def: "Norme di Progetto", abbr: true },
  { term: "Network Asset", def: "Tipo di asset che rappresenta una risorsa del dispositivo relativa alle interfacce e funzionalità di rete, soggetta ai requisiti normativi EN 18031 riguardanti la protezione della rete." },
  { term: "NI", def: "Non Implementato", abbr: true },
  { term: "Nodo", def: "Elemento costitutivo del Decision Tree. Può essere un nodo di decisione, che contiene una domanda a cui l'utente deve rispondere, oppure un nodo foglia, che rappresenta l'esito finale della valutazione." },
  { term: "Nodo di decisione", def: "Nodo intermedio del Decision Tree che contiene una domanda a cui l'utente deve rispondere per determinare il percorso successivo nella valutazione." },
  { term: "Nodo foglia", def: "Nodo terminale del Decision Tree che non ha successori. Rappresenta l'esito finale della valutazione di un percorso: pass, fail o not applicable." },
  { term: "Norma armonizzata", def: "Standard tecnico europeo riconosciuto dalla Commissione Europea come riferimento per soddisfare i requisiti essenziali di una direttiva. Il rispetto di una norma armonizzata conferisce presunzione di conformità alla direttiva corrispondente." },
  { term: "Not Applicable", def: "Esito che indica che un requisito o un nodo del Decision Tree non è applicabile al dispositivo in esame, in quanto le condizioni necessarie per la sua valutazione non sono presenti." },
  { term: "Pass", def: "Esito positivo della valutazione di un requisito o di un nodo del Decision Tree, che indica che il dispositivo soddisfa pienamente il criterio verificato." },
  { term: "PB", def: "Product Baseline", abbr: true },
  { term: "PBI", def: "Product Backlog Item", abbr: true },
  { term: "PDF", def: "Portable Document Format", abbr: true },
  { term: "PdP", def: "Piano di Progetto", abbr: true },
  { term: "PdQ", def: "Piano di Qualifica", abbr: true },
  { term: "Piano di Qualifica", def: "Documento ufficiale che descrive le strategie, i criteri, le metriche e gli strumenti adottati dal team per svolgere le attività di verifica e validazione durante tutto il ciclo di vita del progetto." },
  { term: "Planned Value", def: "Valore economico del lavoro che avrebbe dovuto essere completato entro un dato momento secondo la pianificazione iniziale. Costituisce il riferimento temporale del progetto." },
  { term: "PoC", def: "Proof of Concept", abbr: true },
  { term: "Poetry", def: "Strumento per la gestione delle dipendenze e degli ambienti virtuali in Python, che semplifica la dichiarazione, l'installazione e la risoluzione dei pacchetti necessari al progetto." },
  { term: "Prevenzione delle frodi", def: "Dominio di sicurezza definito dall'articolo 3.3(f) della Direttiva RED, che richiede misure per ridurre il rischio di utilizzo fraudolento dei dispositivi radio. Corrisponde alla terza parte dello standard EN 18031." },
  { term: "Product Baseline", def: "Milestone che segna il completamento della progettazione architetturale e della codifica del prodotto, includendo test, documentazione tecnica e tutto il necessario per il rilascio finale." },
  { term: "Proof of Concept", def: "Prototipo sperimentale sviluppato per validare la fattibilità di una tecnologia, un'integrazione o un approccio architetturale, prima di procedere con lo sviluppo completo del sistema." },
  { term: "Protezione dei dati personali", def: "Dominio di sicurezza definito dall'articolo 3.3(e) della Direttiva RED, che richiede misure per garantire la riservatezza e l'integrità dei dati personali trattati dai dispositivi radio. Corrisponde alla seconda parte dello standard EN 18031." },
  { term: "Protezione della rete", def: "Dominio di sicurezza definito dall'articolo 3.3(d) della Direttiva RED, che richiede che i dispositivi radio non arrechino danno alle reti di comunicazione. Corrisponde alla prima parte dello standard EN 18031." },
  { term: "Pull Request", def: "Richiesta formale di integrare le modifiche sviluppate su un branch secondario nel branch principale. Prevede revisione e approvazione da parte di uno o più membri del team prima che il merge venga eseguito." },
  { term: "PV", def: "Planned Value", abbr: true },
  { term: "RDes", def: "Requisito Desiderabile Funzionale", abbr: true },
  { term: "RDF", def: "Requisito Desiderabile Funzionale", abbr: true },
  { term: "RED", def: "Radio Equipment Directive", abbr: true },
  { term: "Report di valutazione", def: "Documento generato al termine di una sessione di valutazione che riassume i risultati ottenuti, includendo lo stato di ciascun requisito valutato e le evidenze associate." },
  { term: "Requirement and Technology Baseline", def: "Prima milestone formale del progetto, che comprende il completamento dell'Analisi dei Requisiti, la definizione delle tecnologie adottate e le attività di prototipazione (PoC)." },
  { term: "Requirements Stability Index", def: "Metrica che misura quanto i requisiti rimangono stabili nel tempo, calcolando il rapporto tra requisiti modificati o eliminati e il totale dei requisiti definiti. Un valore alto indica buona stabilità." },
  { term: "Requisito", def: "Rappresenta un'esigenza che il sistema deve soddisfare. Dal lato utente, è ciò di cui ha bisogno per raggiungere un obiettivo; dal lato tecnico, è una capacità che il sistema deve implementare per rispondere a tale esigenza. Può essere funzionale (cosa fa il sistema) o non funzionale (come lo fa)." },
  { term: "Requisito funzionale", def: "Requisito che descrive una funzione o un comportamento specifico che il sistema deve essere in grado di eseguire in risposta a determinati input o eventi." },
  { term: "Requisito non funzionale", def: "Requisito che descrive una proprietà o un vincolo del sistema, come prestazioni, sicurezza, usabilità o manutenibilità, senza riferirsi a una funzione specifica." },
  { term: "Responsabile Tecnico", def: "Ruolo con permessi avanzati all'interno del sistema, abilitato alla gestione, modifica e supervisione dei decision tree e delle configurazioni di sistema non accessibili agli utenti standard." },
  { term: "Retrospettiva di Sprint", def: "Riunione che si svolge al termine di ogni sprint. Il team analizza cosa ha funzionato, cosa ha creato problemi e quali azioni intraprendere per migliorare nel ciclo successivo." },
  { term: "RObb", def: "Requisito Obbligatorio Funzionale", abbr: true },
  { term: "ROF", def: "Requisito Obbligatorio Funzionale", abbr: true },
  { term: "ROpz", def: "Requisito Opzionale Funzionale", abbr: true },
  { term: "ROQ", def: "Requisito Obbligatorio di Qualità", abbr: true },
  { term: "ROV", def: "Requisito Obbligatorio di Vincolo", abbr: true },
  { term: "RSI", def: "Requirements Stability Index", abbr: true },
  { term: "RTB", def: "Requirement and Technology Baseline", abbr: true },
  { term: "Ruff", def: "Linter e formatter per codice Python ad alte prestazioni, utilizzato per rilevare errori stilistici, violazioni di convenzioni e per formattare automaticamente il codice in modo uniforme." },
  { term: "Scenario principale", def: "La sequenza di passi ideale di un caso d'uso, quella che si verifica quando tutto va come previsto, senza errori o deviazioni dal flusso atteso." },
  { term: "Scenario secondario", def: "Sequenza alternativa che si attiva in caso di eccezioni, errori o condizioni particolari rispetto allo scenario principale. Definisce il comportamento del sistema nei casi non ordinari." },
  { term: "Schedule Performance Index", def: "Indice di rispetto delle tempistiche calcolato come rapporto EV/PV. Un valore maggiore di 1 indica che il progetto è in anticipo rispetto alla pianificazione." },
  { term: "Scheletro", def: "Struttura del decision tree definita nel modello normativo, composta dall'insieme dei nodi e delle loro relazioni gerarchiche, indipendentemente dalle risposte inserite durante una sessione di valutazione. Uno scheletro è valido se ogni percorso termina in un nodo foglia." },
  { term: "Scheletro di decision tree", def: "Questo termine è usato per facilitare la distinzione tra i decision tree nel contesto di editing rispetto al contesto di valutazione." },
  { term: "Security Asset", def: "Tipo di asset che rappresenta una risorsa del dispositivo rilevante per i requisiti di sicurezza informatica definiti dallo standard EN 18031, in particolare per gli aspetti di autenticazione e controllo degli accessi." },
  { term: "Sessione di valutazione", def: "Sessione di lavoro in cui un utente valuta un dispositivo rispetto a un modello normativo, compilando i Decision Tree associati ai requisiti e registrando evidenze e risposte." },
  { term: "Soluzione web-based", def: "Applicazione accessibile tramite browser web, che non richiede installazione locale e può essere utilizzata da qualsiasi dispositivo connesso a internet." },
  { term: "Sospeso", def: "Stato di valutazione di un requisito che indica che la sua valutazione è bloccata perché almeno un requisito da cui dipende ha ottenuto l'esito Not Applicable." },
  { term: "Specializzazione", def: "Relazione tra casi d'uso in cui un caso d'uso figlio eredita le caratteristiche del caso d'uso padre e le estende con comportamenti più specifici, seguendo il principio di generalizzazione UML." },
  { term: "SPI", def: "Schedule Performance Index", abbr: true },
  { term: "Sprint", def: "Iterazione di sviluppo a durata fissa (nel progetto, bisettimanale) al termine della quale si produce un incremento verificabile del prodotto. È l'unità base del metodo Scrum." },
  { term: "Stakeholder", def: "Soggetto portatore di interesse rispetto al progetto software, che può influenzarne le scelte o esserne influenzato. Include committenti, utenti finali, sviluppatori e responsabili della qualità." },
  { term: "Standard normativo", def: "Insieme di regole e requisiti tecnici definiti da un ente regolatore (es. ISO, IEC) a cui un dispositivo deve conformarsi. Nel sistema viene rappresentato tramite un modello normativo configurabile." },
  { term: "Statement Coverage", def: "Metrica di copertura del codice che indica la percentuale di istruzioni eseguite durante i test automatici. Un valore alto riduce la probabilità che comportamenti non testati nascondano difetti." },
  { term: "Stato aggregato", def: "Valore sintetico calcolato dal sistema che rappresenta il risultato complessivo della valutazione di un dispositivo o di un asset, derivato dalla combinazione degli esiti dei singoli requisiti valutati." },
  { term: "TA", def: "Test di Accettazione", abbr: true },
  { term: "TCPI", def: "To Complete Performance Index", abbr: true },
  { term: "Test di Accettazione", def: "Verifica che il sistema soddisfi le aspettative dell'utente finale, validando i flussi operativi completi secondo scenari concordati con la proponente." },
  { term: "Test di Integrazione", def: "Verifica la corretta interazione tra componenti o moduli distinti del sistema, assicurandosi che le interfacce tra le parti si comportino come previsto." },
  { term: "Test di Sistema", def: "Verifica che il sistema nel suo complesso soddisfi i requisiti funzionali e non funzionali specificati, simulando scenari d'uso reali sull'applicazione integrata." },
  { term: "Test di Unità", def: "Verifica il comportamento di singole unità di codice in isolamento, come funzioni o classi, garantendo la correttezza della logica implementata." },
  { term: "TI", def: "Test di Integrazione", abbr: true },
  { term: "Time Efficiency", def: "Metrica che misura l'efficienza temporale del team, calcolata come rapporto tra il tempo stimato per un'attività e il tempo effettivamente impiegato per completarla." },
  { term: "To Complete Performance Index", def: "Indice che indica il livello di efficienza economica necessario per completare il progetto rispettando il budget residuo disponibile." },
  { term: "Tracciamento automatico", def: "Meccanismo che collega sistematicamente i casi d'uso ai requisiti corrispondenti tramite script dedicati, garantendo coerenza e completezza tra le specifiche e la documentazione prodotta." },
  { term: "Trigger", def: "Evento specifico o azione dell'attore che avvia l'esecuzione di un caso d'uso. Rappresenta la condizione che porta il sistema a entrare nel flusso descritto dallo scenario principale." },
  { term: "TS", def: "Test di Sistema", abbr: true },
  { term: "TU", def: "Test di Unità", abbr: true },
  { term: "TurboScribe AI", def: "Strumento basato su intelligenza artificiale utilizzato per la trascrizione automatica delle riunioni, producendo verbali testuali a partire da registrazioni audio o video." },
  { term: "Typst", def: "Linguaggio di markup moderno utilizzato per la composizione tipografica dei documenti del progetto, pensato come alternativa a LaTeX con sintassi più semplice e compilazione più rapida." },
  { term: "UML", def: "Unified Modeling Language", abbr: true },
  { term: "Validazione", def: "Processo che assicura che il prodotto costruito corrisponda alle reali esigenze dell'utente finale. Risponde alla domanda: Stiamo costruendo il sistema giusto?" },
  { term: "Valutazione", def: "Processo di verifica della conformità di un dispositivo rispetto a un modello normativo, condotto compilando i Decision Tree associati a ciascun requisito e registrando evidenze a supporto delle risposte fornite." },
  { term: "Valutazione di conformità", def: "Processo formale che verifica se un dispositivo soddisfa i requisiti normativi applicabili, producendo un esito documentato e tracciabile per ciascun requisito valutato." },
  { term: "Verifica", def: "Processo di controllo interno che assicura che il prodotto sia stato costruito correttamente rispetto alle specifiche definite. Risponde alla domanda: Stiamo costruendo il sistema nel modo giusto?" },
  { term: "Versionamento dello standard", def: "Gestione delle versioni successive di un modello normativo nel tempo, che consente di tracciare le modifiche apportate allo standard e mantenere la compatibilità con le valutazioni precedenti." },
  { term: "Versionamento semantico", def: "Convenzione per l'assegnazione dei numeri di versione strutturata in tre componenti: MAJOR (modifiche significative che invalidano valutazioni esistenti), MINOR (modifiche non significative a campi testuali). Applicata dal sistema al salvataggio delle modifiche al modello." },
  { term: "Wi-Fi", def: "Tecnologia di comunicazione wireless basata sullo standard IEEE 802.11 che consente la connessione a reti locali senza l'uso di cavi. Nel contesto del progetto, rappresenta una delle interfacce di rete soggette a valutazione normativa EN 18031." },
  { term: "Workflow documentale", def: "Modello a stati che governa il ciclo di vita di ogni documento: Backlog → In lavorazione → In verifica → In validazione → Done, garantendo un processo controllato e tracciabile per ogni prodotto documentale." },
  { term: "XML", def: "eXtensible Markup Language", abbr: true },
];

function isAbbr(t) {
  return !!t.abbr || (t.term.length <= 4 && t.term === t.term.toUpperCase()) || t.term.includes('.');
}
terms.forEach(t => { t.isAbbr = isAbbr(t); });
terms.sort((a, b) => a.term.localeCompare(b.term, 'it'));
const allLetters = [...new Set(terms.map(t => t.term[0].toUpperCase()))].sort();

let activeLetter = null;
let activeType = 'all';
let searchQuery = '';

const letterNav = document.getElementById('letterNav');
'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => {
  const btn = document.createElement('button');
  btn.className = 'glossario-letter-btn';
  btn.textContent = l;
  btn.dataset.letter = l;
  if (!allLetters.includes(l)) btn.disabled = true;
  btn.onclick = () => { activeLetter = (activeLetter === l) ? null : l; renderLetterNav(); render(); };
  letterNav.appendChild(btn);
});
const clearBtn = document.createElement('button');
clearBtn.className = 'glossario-letter-btn clear-btn';
clearBtn.textContent = 'tutti';
clearBtn.onclick = () => { activeLetter = null; renderLetterNav(); render(); };
letterNav.appendChild(clearBtn);

function renderLetterNav() {
  document.querySelectorAll('.glossario-letter-btn[data-letter]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.letter === activeLetter);
  });
}

function setTypeFilter(type, btn) {
  activeType = type;
  document.querySelectorAll('.glossario-type-btn').forEach(b => b.classList.remove('active', 'active-abbr', 'active-term'));
  if (type === 'all') btn.classList.add('active');
  else if (type === 'abbr') btn.classList.add('active-abbr');
  else btn.classList.add('active-term');
  render();
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlight(text, q) {
  if (!q) return text;
  return text.replace(new RegExp('(' + escapeRegex(q) + ')', 'gi'), '<mark>$1</mark>');
}

function render() {
  const q = searchQuery.trim().toLowerCase();
  const main = document.getElementById('main');
  const noResults = document.getElementById('noResults');

  let filtered = terms.filter(t => {
    if (activeLetter && t.term[0].toUpperCase() !== activeLetter) return false;
    if (activeType === 'abbr' && !t.isAbbr) return false;
    if (activeType === 'term' && t.isAbbr) return false;
    if (q && !t.term.toLowerCase().includes(q) && !t.def.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('totalCount').textContent = terms.length + ' termini';

  const bar = document.getElementById('resultsBar');
  bar.innerHTML = (q || activeLetter || activeType !== 'all') ? '<b>' + filtered.length + '</b> risultati trovati' : '';

  const groups = {};
  filtered.forEach(t => {
    const l = t.term[0].toUpperCase();
    if (!groups[l]) groups[l] = [];
    groups[l].push(t);
  });

  main.querySelectorAll('.glossario-section').forEach(s => s.remove());
  noResults.classList.toggle('show', filtered.length === 0);

  Object.keys(groups).sort().forEach(letter => {
    const section = document.createElement('section');
    section.className = 'glossario-section';
    section.id = 'glossario-section-' + letter;

    const heading = document.createElement('div');
    heading.className = 'glossario-section-letter';
    heading.textContent = letter;
    section.appendChild(heading);

    groups[letter].forEach(t => {
      const card = document.createElement('article');
      card.className = 'glossario-term-card';

      const header = document.createElement('div');
      header.className = 'glossario-term-header';

      const name = document.createElement('span');
      name.className = 'glossario-term-name';
      name.innerHTML = highlight(t.term, searchQuery.trim());
      header.appendChild(name);

      const badge = document.createElement('span');
      badge.className = 'glossario-badge ' + (t.isAbbr ? 'glossario-badge-abbr' : 'glossario-badge-term');
      badge.textContent = t.isAbbr ? 'abbrev.' : 'termine';
      header.appendChild(badge);

      card.appendChild(header);

      const def = document.createElement('div');
      def.className = 'glossario-term-def';
      def.innerHTML = highlight(t.def, searchQuery.trim());
      card.appendChild(def);

      section.appendChild(card);
    });

    main.appendChild(section);
  });
}

document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value;
  render();
});

window.addEventListener('scroll', () => {
  document.getElementById('glossario-scrollTop').classList.toggle('visible', window.scrollY > 300);
});

render();
</script>
</body>
</html>
